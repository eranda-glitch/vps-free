name: Build Website IPA
run-name: Web IPA - ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      website_url:
        description: HTTPS website to open
        type: string
        required: true
      app_name:
        description: App display name (1-30 characters)
        type: string
        required: true
      bundle_id:
        description: Unique bundle ID (com.yourname.myapp)
        type: string
        required: true
      request_id:
        description: Request identifier supplied by PHP IPA Builder
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Validate app settings
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.parse
          url = os.environ['WEBSITE_URL']
          parsed = urllib.parse.urlsplit(url)
          assert len(url) <= 2048 and parsed.scheme == 'https' and parsed.hostname and '.' in parsed.hostname, 'Use a public HTTPS URL'
          assert parsed.username is None and parsed.password is None, 'Credentials in URLs are not supported'
          assert not re.search(r'[\x00-\x20\x7f]', url), 'Invalid URL characters'
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9 ._-]{0,29}', os.environ['APP_NAME']), 'Invalid app name'
          assert len(os.environ['BUNDLE_ID']) <= 150 and re.fullmatch(r'[A-Za-z][A-Za-z0-9-]*(?:\.[A-Za-z][A-Za-z0-9-]*)+', os.environ['BUNDLE_ID']), 'Invalid bundle ID'
          assert re.fullmatch(r'[a-f0-9]{32}', os.environ['REQUEST_ID']), 'Invalid request identifier'
          PY
      - name: Create native app template
        run: |
          cat > 'WebApp.m' <<'IPA_TEMPLATE_EOF'
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          
          @interface GameViewController : UIViewController <WKNavigationDelegate>
          @property(nonatomic, strong) WKWebView *webView;
          @property(nonatomic, strong) UIActivityIndicatorView *spinner;
          @property(nonatomic) UIStatusBarStyle appStatusBarStyle;
          @end
          
          @implementation GameViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              UIColor *loadingColor = [UIColor colorWithRed:0.07 green:0.07 blue:0.08 alpha:1.0];
              self.appStatusBarStyle = UIStatusBarStyleLightContent;
              self.view.backgroundColor = loadingColor;
              WKWebViewConfiguration *configuration = [[WKWebViewConfiguration alloc] init];
              configuration.allowsInlineMediaPlayback = YES;
              self.webView = [[WKWebView alloc] initWithFrame:CGRectZero configuration:configuration];
              self.webView.navigationDelegate = self;
              self.webView.opaque = NO;
              self.webView.backgroundColor = loadingColor;
              self.webView.scrollView.backgroundColor = loadingColor;
              self.webView.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:self.webView];
              UILayoutGuide *safe = self.view.safeAreaLayoutGuide;
              [NSLayoutConstraint activateConstraints:@[
                  [self.webView.topAnchor constraintEqualToAnchor:safe.topAnchor],
                  [self.webView.bottomAnchor constraintEqualToAnchor:safe.bottomAnchor],
                  [self.webView.leadingAnchor constraintEqualToAnchor:safe.leadingAnchor],
                  [self.webView.trailingAnchor constraintEqualToAnchor:safe.trailingAnchor]
              ]];
              self.spinner = [[UIActivityIndicatorView alloc] initWithActivityIndicatorStyle:UIActivityIndicatorViewStyleMedium];
              self.spinner.translatesAutoresizingMaskIntoConstraints = NO;
              self.spinner.hidesWhenStopped = YES;
              [self.view addSubview:self.spinner];
              [NSLayoutConstraint activateConstraints:@[
                  [self.spinner.centerXAnchor constraintEqualToAnchor:self.view.centerXAnchor],
                  [self.spinner.centerYAnchor constraintEqualToAnchor:self.view.centerYAnchor]
              ]];
              [self loadGame];
          }
          - (UIStatusBarStyle)preferredStatusBarStyle {
              return self.appStatusBarStyle;
          }
          - (void)matchSafeAreaToWebsite {
              NSString *script = @"(() => { const pick = (el) => { if (!el) return null; const value = getComputedStyle(el).backgroundColor; const parts = value && value.match(/[\\d.]+/g); if (!parts || parts.length < 3 || (parts.length > 3 && Number(parts[3]) === 0)) return null; return parts.slice(0, 3).map(Number); }; return pick(document.body) || pick(document.documentElement); })()";
              __weak GameViewController *weakSelf = self;
              [self.webView evaluateJavaScript:script completionHandler:^(id result, NSError *error) {
                  if (error || ![result isKindOfClass:NSArray.class] || [(NSArray *)result count] < 3) return;
                  NSArray *rgb = (NSArray *)result;
                  CGFloat red = [rgb[0] doubleValue] / 255.0;
                  CGFloat green = [rgb[1] doubleValue] / 255.0;
                  CGFloat blue = [rgb[2] doubleValue] / 255.0;
                  UIColor *color = [UIColor colorWithRed:red green:green blue:blue alpha:1.0];
                  weakSelf.view.backgroundColor = color;
                  weakSelf.webView.backgroundColor = color;
                  weakSelf.webView.scrollView.backgroundColor = color;
                  CGFloat luminance = (0.2126 * red) + (0.7152 * green) + (0.0722 * blue);
                  weakSelf.appStatusBarStyle = luminance < 0.55 ? UIStatusBarStyleLightContent : UIStatusBarStyleDarkContent;
                  [weakSelf setNeedsStatusBarAppearanceUpdate];
              }];
          }
          - (void)loadGame {
              [self.spinner startAnimating];
              [self.webView loadRequest:[NSURLRequest requestWithURL:[NSURL URLWithString:[[NSBundle mainBundle] objectForInfoDictionaryKey:@"WebsiteURL"]]]];
          }
          - (void)webView:(WKWebView *)webView didFinishNavigation:(WKNavigation *)navigation {
              [self.spinner stopAnimating];
              [self matchSafeAreaToWebsite];
              NSLog(@"WEB_APP_LOADED %@", webView.URL.absoluteString);
          }
          - (void)showError:(NSError *)error {
              if (error.code == NSURLErrorCancelled) return;
              [self.spinner stopAnimating];
              NSLog(@"WEB_APP_FAILED %@", error.localizedDescription);
              if (self.presentedViewController) return;
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"Could not load the website"
                  message:@"Check your internet connection and try again." preferredStyle:UIAlertControllerStyleAlert];
              __weak GameViewController *weakSelf = self;
              [alert addAction:[UIAlertAction actionWithTitle:@"Retry" style:UIAlertActionStyleDefault
                  handler:^(UIAlertAction *action) { [weakSelf loadGame]; }]];
              [alert addAction:[UIAlertAction actionWithTitle:@"Cancel" style:UIAlertActionStyleCancel handler:nil]];
              [self presentViewController:alert animated:YES completion:nil];
          }
          - (void)webView:(WKWebView *)webView didFailNavigation:(WKNavigation *)navigation withError:(NSError *)error {
              [self showError:error];
          }
          - (void)webView:(WKWebView *)webView didFailProvisionalNavigation:(WKNavigation *)navigation withError:(NSError *)error {
              [self showError:error];
          }
          @end
          
          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property(nonatomic, strong) UIWindow *window;
          @end
          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              self.window.rootViewController = [[GameViewController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end
          
          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass(AppDelegate.class));
              }
          }
          IPA_TEMPLATE_EOF
          cat > 'Info.plist' <<'IPA_TEMPLATE_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleDisplayName</key><string>Web App</string>
            <key>CFBundleExecutable</key><string>WebApp</string>
            <key>CFBundleIdentifier</key><string>io.github.eranda-glitch.flappyweb</string>
            <key>CFBundleName</key><string>WebApp</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer></array>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
            <key>UILaunchScreen</key><dict/>
            <key>CFBundleIcons</key><dict>
              <key>CFBundlePrimaryIcon</key><dict>
                <key>CFBundleIconFiles</key><array><string>AppIcon60x60</string></array>
                <key>UIPrerenderedIcon</key><false/>
              </dict>
            </dict>
          </dict></plist>
          IPA_TEMPLATE_EOF
          cat > 'build-ios.sh' <<'IPA_TEMPLATE_EOF'
          #!/bin/bash
          set -euo pipefail
          cd "$(dirname "$0")"
          SDK="${1:-iphoneos}"
          case "$SDK" in
            iphoneos) TARGET="arm64-apple-ios15.0"; PLATFORM="iPhoneOS"; APP="build/device/Payload/WebApp.app" ;;
            iphonesimulator) TARGET="$(uname -m)-apple-ios15.0-simulator"; PLATFORM="iPhoneSimulator"; APP="build/simulator/WebApp.app" ;;
            *) echo "Unsupported SDK: $SDK" >&2; exit 1 ;;
          esac
          mkdir -p "$APP" artifacts
          xcrun --sdk "$SDK" clang -target "$TARGET" -isysroot "$(xcrun --sdk "$SDK" --show-sdk-path)" \
            -fobjc-arc -O2 -Wall -Wextra -Wno-unused-parameter \
            -framework UIKit -framework WebKit -framework Foundation -framework CoreGraphics WebApp.m -o "$APP/WebApp"
          cp Info.plist "$APP/Info.plist"
          cp AppIcon60x60@2x.png AppIcon60x60@3x.png "$APP/"
          /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms array" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms:0 string $PLATFORM" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER:-1}" "$APP/Info.plist"
          printf 'APPL????' > "$APP/PkgInfo"
          plutil -lint "$APP/Info.plist"
          plutil -convert binary1 "$APP/Info.plist"
          if [[ "$SDK" == "iphoneos" ]]; then
            if codesign -d "$APP/WebApp" 2>/dev/null; then
              codesign --remove-signature "$APP/WebApp"
            fi
            if codesign -d "$APP/WebApp" 2>/dev/null; then
              echo 'Device executable must be unsigned' >&2; exit 1
            fi
            file "$APP/WebApp" | tee artifacts/device-binary.txt
            xcrun lipo "$APP/WebApp" -verify_arch arm64
            (cd build/device && /usr/bin/zip -q -r ../../artifacts/WebApp-unsigned.ipa Payload)
            unzip -t artifacts/WebApp-unsigned.ipa
            shasum -a 256 artifacts/WebApp-unsigned.ipa | tee artifacts/SHA256SUMS.txt
          else
            /usr/libexec/PlistBuddy -c 'Delete :UIRequiredDeviceCapabilities' "$APP/Info.plist"
            codesign --force --sign - "$APP"
          fi
          IPA_TEMPLATE_EOF
          printf '%s' '' | base64 --decode > 'AppIcon60x60@2x.png'
          printf '%s' '' | base64 --decode > 'AppIcon60x60@3x.png'
      - name: Apply app settings
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          python3 - <<'PY'
          import os, plistlib
          with open('Info.plist', 'rb') as f:
              info = plistlib.load(f)
          info['CFBundleDisplayName'] = os.environ['APP_NAME']
          info['CFBundleIdentifier'] = os.environ['BUNDLE_ID']
          info['WebsiteURL'] = os.environ['WEBSITE_URL']
          with open('Info.plist', 'wb') as f:
              plistlib.dump(info, f)
          PY
      - name: Build and verify unsigned iPhone IPA
        run: bash build-ios.sh iphoneos
      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: website-ipa
          path: artifacts/WebApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload build checks
        uses: actions/upload-artifact@v7
        with:
          name: build-checks
          path: artifacts/*.txt
          if-no-files-found: error
          retention-days: 30
