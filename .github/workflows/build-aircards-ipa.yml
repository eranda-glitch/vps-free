name: Build AirCards IPA
run-name: AirCards IPA - ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App display name
        type: string
        required: true
      bundle_id:
        description: Unique bundle ID
        type: string
        required: true
      request_id:
        description: Request identifier supplied by AirCards Studio
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      SOURCE_ARCHIVE: https://github.com/Mak5er/AirCard-iOS/archive/refs/tags/v1.3.1.zip
    steps:
      - name: Check out Udara assets
        uses: actions/checkout@v5

      - name: Validate build settings
        env:
          APP_NAME: ${{ inputs.app_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9 ._-]{0,23}', os.environ['APP_NAME']), 'Invalid app name'
          assert len(os.environ['BUNDLE_ID']) <= 150 and re.fullmatch(r'[A-Za-z][A-Za-z0-9-]*(?:\.[A-Za-z][A-Za-z0-9-]*)+', os.environ['BUNDLE_ID']), 'Invalid bundle ID'
          assert re.fullmatch(r'[a-f0-9]{32}', os.environ['REQUEST_ID']), 'Invalid request identifier'
          PY

      - name: Download pinned AirCard source
        run: |
          curl --fail --location --retry 3 --output source.zip "$SOURCE_ARCHIVE"
          test "$(stat -f%z source.zip)" -lt 157286400
          ditto -x -k source.zip unpacked
          SOURCE_DIR="$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SOURCE_DIR"
          mv "$SOURCE_DIR" AirCardsSource
          test -f AirCardsSource/LICENSE
          test -f AirCardsSource/AirCard-iOS.xcodeproj/project.pbxproj
          test -f AirCardsSource/AirliftFFI.xcframework/Info.plist

      - name: Apply app identity
        env:
          APP_NAME: ${{ inputs.app_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib
          root = pathlib.Path('AirCardsSource')
          name = os.environ['APP_NAME']
          for path in (root / 'ios-app').glob('*.swift'):
              path.write_text(path.read_text().replace('AirCard-iOS', name))
          plist_path = root / 'ios-app' / 'Info.plist'
          with plist_path.open('rb') as f:
              info = plistlib.load(f)
          info['CFBundleDisplayName'] = name
          info['NSLocalNetworkUsageDescription'] = f'{name} connects to local device services after you approve pairing.'
          info['NSPhotoLibraryUsageDescription'] = f'{name} uses selected photos to create card skins and themes.'
          with plist_path.open('wb') as f:
              plistlib.dump(info, f, sort_keys=False)
          PY

      - name: Fix passcode theme importing
        run: |
          python3 - <<'PY'
          import base64, pathlib, re, zipfile

          view_model = pathlib.Path('AirCardsSource/ios-app/AppViewModel.swift')
          source = view_model.read_text()
          source = source.replace(
              '    @Published var passthmFlashLog: [String] = []\n',
              '    @Published var passthmFlashLog: [String] = []\n'
              '    @Published var passthmImportLog: [String] = []\n',
              1
          )

          theme_path = pathlib.Path('colored_numbers.passthm')
          if not theme_path.is_file():
              raise RuntimeError('The bundled Colored Numbers theme is missing')
          encoded_keys = {}
          with zipfile.ZipFile(theme_path) as archive:
              for name in archive.namelist():
                  match = re.search(r'(?:^|/)(?:[A-Za-z]+-)?([0-9])(?:-|\.)', name)
                  if match and name.lower().endswith(('.png', '.jpg', '.jpeg')) and match.group(1) not in encoded_keys:
                      encoded_keys[match.group(1)] = base64.b64encode(archive.read(name)).decode('ascii')
          if set(encoded_keys) != set('0123456789'):
              raise RuntimeError(f'Colored Numbers must contain digits 0-9; found {sorted(encoded_keys)}')

          dictionary_rows = '\n'.join(
              f'            "{digit}": "{encoded_keys[digit]}",'
              for digit in sorted(encoded_keys)
          )
          bundled_method = '''    func loadBundledColoredNumbers() {
              passthmImportLog = ["🎨 Loading bundled Colored Numbers theme…"]
              let encoded: [String: String] = [
          ''' + dictionary_rows + '''
              ]
              var keys: [String: UIImage] = [:]
              var rawData: [String: Data] = [:]
              for (digit, value) in encoded {
                  guard let data = Data(base64Encoded: value),
                        let image = ImageEngine.safeImageFromData(data, maxDimension: 512) else {
                      passthmImportLog.append("❌ Could not decode keypad image \(digit)")
                      continue
                  }
                  rawData[digit] = data
                  keys[digit] = image
              }
              guard keys.count == 10 else {
                  passthmImportLog.append("❌ Loaded only \(keys.count) of 10 keypad images")
                  errorMessage = "The bundled Colored Numbers theme could not be decoded."
                  return
              }
              loadedTheme = PasscodeThemeInfo(
                  name: "Colored Numbers",
                  filePath: "bundled://colored_numbers.passthm",
                  fileCount: 10,
                  keysPreview: keys,
                  rawKeyData: rawData
              )
              passthmFlashPhase = .idle
              passthmImportLog.append("✅ Colored Numbers loaded directly: 10 of 10 keypad images")
              errorMessage = nil
          }

          '''
          method_start = source.index('    func loadPassthm(url: URL) {')
          source = source[:method_start] + bundled_method + source[method_start:]
          method_start = source.index('    func loadPassthm(url: URL) {')
          method_end = source.index('    func loadPassthmFromDocuments(filename: String) {', method_start)
          fixed_method = '''    func loadPassthm(url: URL) {
              let displayName = url.deletingPathExtension().lastPathComponent
              let originalPath = url.path
              let stagedURL = FileManager.default.temporaryDirectory
                  .appendingPathComponent("aircard_import_\(UUID().uuidString).passthm")

              errorMessage = nil
              loadedTheme = nil
              passthmImportLog = [
                  "📥 Selected: \(url.lastPathComponent)",
                  "⏳ Copying the archive into Udara-iOS…"
              ]
              do {
                  try FileManager.default.copyItem(at: url, to: stagedURL)
              } catch {
                  passthmImportLog.append("❌ Copy failed: \(error.localizedDescription)")
                  errorMessage = "Could not import the selected .passthm file: \(error.localizedDescription)"
                  return
              }

              Task.detached {
                  defer { try? FileManager.default.removeItem(at: stagedURL) }
                  let byteCount = (try? FileManager.default.attributesOfItem(atPath: stagedURL.path)[.size] as? NSNumber)?.intValue ?? 0
                  var diagnostics = ["✅ Local copy ready: \(byteCount) bytes"]
                  var result = PasscodeThemeReader.inspect(url: stagedURL)

                  if result == nil {
                      let diagnosticDir = FileManager.default.temporaryDirectory
                          .appendingPathComponent("udara_passthm_debug_\(UUID().uuidString)")
                      try? FileManager.default.createDirectory(at: diagnosticDir, withIntermediateDirectories: true)
                      defer { try? FileManager.default.removeItem(at: diagnosticDir) }

                      let extractCode = stagedURL.path.withCString { archiveC in
                          diagnosticDir.path.withCString { destinationC in
                              al_passthm_extract(archiveC, destinationC)
                          }
                      }
                      diagnostics.append("Archive extraction result: \(extractCode == 0 ? "success" : "failed (code \(extractCode))")")

                      let paths = FileManager.default.subpaths(atPath: diagnosticDir.path) ?? []
                      let images = paths.filter {
                          let lower = $0.lowercased()
                          return lower.hasSuffix(".png") || lower.hasSuffix(".jpg") || lower.hasSuffix(".jpeg")
                      }
                      let recognized = images.filter {
                          PasscodeThemeReader.extractDigit(from: ($0 as NSString).lastPathComponent) != nil
                      }
                      diagnostics.append("Extracted entries: \(paths.count); images: \(images.count); recognized keypad images: \(recognized.count)")

                      if !images.isEmpty && recognized.isEmpty {
                          let sample = images.prefix(5).map { ($0 as NSString).lastPathComponent }.joined(separator: ", ")
                          diagnostics.append("⚠️ Unrecognized filenames: \(sample)")
                      }

                      let nestedArchives = paths.filter {
                          let lower = $0.lowercased()
                          return lower.hasSuffix(".passthm") || lower.hasSuffix(".zip")
                      }
                      if !nestedArchives.isEmpty {
                          diagnostics.append("Found \(nestedArchives.count) nested archive(s); trying them…")
                          for nested in nestedArchives {
                              let nestedURL = diagnosticDir.appendingPathComponent(nested)
                              if let nestedResult = PasscodeThemeReader.inspect(url: nestedURL) {
                                  result = nestedResult
                                  diagnostics.append("✅ Loaded nested archive: \((nested as NSString).lastPathComponent)")
                                  break
                              }
                          }
                      }
                  }

                  await MainActor.run {
                      self.passthmImportLog = diagnostics
                      if let (keys, rawData, count) = result {
                          self.loadedTheme = PasscodeThemeInfo(
                              name: displayName,
                              filePath: originalPath,
                              fileCount: count,
                              keysPreview: keys,
                              rawKeyData: rawData
                          )
                          self.passthmImportLog.append("✅ Theme loaded: \(keys.count) keypad images from \(count) image files")
                      } else {
                          self.passthmImportLog.append("❌ No usable keypad images were found")
                          self.errorMessage = "Theme import failed. Open Import Diagnostics below for the exact reason."
                      }
                  }
              }
          }

          '''
          source = source[:method_start] + fixed_method + source[method_end:]
          view_model.write_text(source)

          content_view = pathlib.Path('AirCardsSource/ios-app/ContentView.swift')
          source = content_view.read_text()
          old_types = '''                    UTType(filenameExtension: "passthm") ?? .archive,
                              UTType.zip,
                              UTType.archive
          '''
          new_types = '''                    UTType(filenameExtension: "passthm") ?? .archive,
                              UTType.zip,
                              UTType.archive,
                              UTType.data
          '''
          if old_types not in source:
              raise RuntimeError('Passcode document picker definition was not found')
          source = source.replace(old_types, new_types, 1)
          diagnostics_anchor = '''        if let theme = vm.loadedTheme {
          '''
          diagnostics_ui = '''        if !vm.passthmImportLog.isEmpty {
              Section("Import Diagnostics") {
                  CompactLogView(
                      title: "Passcode file log (\(vm.passthmImportLog.count) lines)",
                      lines: vm.passthmImportLog,
                      onClear: { vm.passthmImportLog.removeAll() }
                  )
              }
          }

          '''
          if diagnostics_anchor not in source:
              raise RuntimeError('Passcode diagnostics insertion point was not found')
          source = source.replace(diagnostics_anchor, diagnostics_ui + diagnostics_anchor, 1)
          built_in_anchor = '''        if !vm.passthmImportLog.isEmpty {
          '''
          built_in_ui = '''        Section("Ready-to-use Theme") {
              Button {
                  vm.loadBundledColoredNumbers()
              } label: {
                  Label("Load Colored Numbers", systemImage: "paintpalette.fill")
                      .frame(maxWidth: .infinity, alignment: .center)
              }
              .buttonStyle(.borderedProminent)
              .tint(.green)

              Text("Built from the attached colored_numbers.passthm file. This bypasses file-picker and archive compatibility problems.")
                  .font(.caption)
                  .foregroundStyle(.secondary)
          }

          '''
          if built_in_anchor not in source:
              raise RuntimeError('Built-in theme insertion point was not found')
          content_view.write_text(source.replace(built_in_anchor, built_in_ui + built_in_anchor, 1))
          PY

      - name: Add Tendies and Batter wallpaper importing
        run: |
          python3 - <<'PY'
          import pathlib, plistlib

          view_model = pathlib.Path('AirCardsSource/ios-app/AppViewModel.swift')
          source = view_model.read_text()
          source = source.replace(
              'for u in rootItems where u.pathExtension.lowercased() == "tendies" {',
              'for u in rootItems where ["tendies", "batter"].contains(u.pathExtension.lowercased()) {',
              1
          )
          source = source.replace(
              'for u in storedItems where u.pathExtension.lowercased() == "tendies" {',
              'for u in storedItems where ["tendies", "batter"].contains(u.pathExtension.lowercased()) {',
              1
          )
          if source.count('["tendies", "batter"].contains') != 2:
              raise RuntimeError('Wallpaper archive discovery patch did not apply')
          view_model.write_text(source)

          tendies_view = pathlib.Path('AirCardsSource/ios-app/TendiesView.swift')
          source = tendies_view.read_text()
          picker_anchor = '''        if let extType = UTType(filenameExtension: "tendies") {
              contentTypes.append(extType)
          }
          '''
          picker_replacement = picker_anchor + '''        if let batterType = UTType(filenameExtension: "batter") {
              contentTypes.append(batterType)
          }
          '''
          if picker_anchor not in source:
              raise RuntimeError('Wallpaper picker insertion point was not found')
          source = source.replace(picker_anchor, picker_replacement, 1)
          source = source.replace('Choose .tendies from Files…', 'Choose .tendies or .batter…')
          source = source.replace('No .tendies wallpapers loaded yet', 'No wallpaper packages loaded yet')
          source = source.replace(
              "Tap 'Choose .tendies from Files' or copy wallpapers into On My iPhone › AirCard-iOS.",
              "Choose a .tendies or .batter file, or copy one into On My iPhone › AirCard-iOS."
          )
          tendies_view.write_text(source)

          engine = pathlib.Path('AirCardsSource/ios-app/TendiesEngine.swift')
          source = engine.read_text()
          function_start = source.index('    private func findDescriptorsWithExtensions(in rootURL: URL, defaultExt: String)')
          function_end_marker = '        return results.isEmpty ? [(ext: defaultExt, url: rootURL)] : results\n    }'
          function_end = source.index(function_end_marker, function_start) + len(function_end_marker)
          replacement = '''    private func wallpaperPayloadRoot(in rootURL: URL, fileManager: FileManager) -> URL {
              var current = rootURL
              let layoutNames: Set<String> = [
                  "container", "descriptors", "descriptor", "ordered-descriptors",
                  "ordered-descriptor", "video-descriptors", "video-descriptor"
              ]

              // Batter templates commonly add one named wrapper folder plus __MACOSX.
              // Descend through wrappers until a recognized wallpaper layout is reached.
              for _ in 0..<5 {
                  guard let entries = try? fileManager.contentsOfDirectory(
                      at: current,
                      includingPropertiesForKeys: [.isDirectoryKey],
                      options: [.skipsHiddenFiles]
                  ) else { return current }
                  let directories = entries.filter {
                      ((try? $0.resourceValues(forKeys: [.isDirectoryKey]).isDirectory) ?? false) &&
                      $0.lastPathComponent.caseInsensitiveCompare("__MACOSX") != .orderedSame
                  }
                  if directories.contains(where: { layoutNames.contains($0.lastPathComponent.lowercased()) }) {
                      return current
                  }
                  guard directories.count == 1 else { return current }
                  current = directories[0]
              }
              return current
          }

          private func findDescriptorsWithExtensions(in rootURL: URL, defaultExt: String) -> [(ext: String, url: URL)] {
              let fileManager = FileManager.default
              var results: [(ext: String, url: URL)] = []
              let payloadRoot = wallpaperPayloadRoot(in: rootURL, fileManager: fileManager)

              // 1. Standard PosterBoard container, accepting Container or container.
              let rootEntries = (try? fileManager.contentsOfDirectory(
                  at: payloadRoot,
                  includingPropertiesForKeys: [.isDirectoryKey],
                  options: [.skipsHiddenFiles]
              )) ?? []
              let containerFolder = rootEntries.first {
                  $0.lastPathComponent.caseInsensitiveCompare("container") == .orderedSame &&
                  ((try? $0.resourceValues(forKeys: [.isDirectoryKey]).isDirectory) ?? false)
              }
              let searchRoots = containerFolder.map { [$0, payloadRoot] } ?? [payloadRoot]

              for searchRoot in searchRoots {
                  for structureVersion in [61, 59] {
                      let extensionsDir = searchRoot.appendingPathComponent(
                          "Library/Application Support/PRBPosterExtensionDataStore/\(structureVersion)/Extensions"
                      )
                      guard fileManager.fileExists(atPath: extensionsDir.path),
                            let extensionFolders = try? fileManager.contentsOfDirectory(
                              at: extensionsDir,
                              includingPropertiesForKeys: [.isDirectoryKey],
                              options: [.skipsHiddenFiles]
                            ) else { continue }
                      for extensionFolder in extensionFolders {
                          let descriptorDirectory = extensionFolder.appendingPathComponent("descriptors")
                          guard let descriptorFolders = try? fileManager.contentsOfDirectory(
                              at: descriptorDirectory,
                              includingPropertiesForKeys: [.isDirectoryKey],
                              options: [.skipsHiddenFiles]
                          ) else { continue }
                          for descriptor in descriptorFolders where
                              ((try? descriptor.resourceValues(forKeys: [.isDirectoryKey]).isDirectory) ?? false) {
                              if !descriptor.lastPathComponent.hasPrefix(".") &&
                                  descriptor.lastPathComponent.caseInsensitiveCompare("__MACOSX") != .orderedSame {
                                  results.append((ext: extensionFolder.lastPathComponent, url: descriptor))
                              }
                          }
                      }
                  }
              }
              if !results.isEmpty { return results }

              // 2. Tendies and Batter descriptor directories.
              for folderName in ["descriptors", "descriptor", "ordered-descriptors", "ordered-descriptor"] {
                  let descriptorDirectory = payloadRoot.appendingPathComponent(folderName)
                  guard let contents = try? fileManager.contentsOfDirectory(
                      at: descriptorDirectory,
                      includingPropertiesForKeys: [.isDirectoryKey],
                      options: [.skipsHiddenFiles]
                  ) else { continue }
                  for descriptor in contents where
                      ((try? descriptor.resourceValues(forKeys: [.isDirectoryKey]).isDirectory) ?? false) {
                      if !descriptor.lastPathComponent.hasPrefix(".") &&
                          descriptor.lastPathComponent.caseInsensitiveCompare("__MACOSX") != .orderedSame {
                          results.append((ext: defaultExt, url: descriptor))
                      }
                  }
              }
              if !results.isEmpty { return results }

              // 3. Suggested Photos/video descriptor directories.
              for folderName in ["video-descriptors", "video-descriptor"] {
                  let descriptorDirectory = payloadRoot.appendingPathComponent(folderName)
                  guard let contents = try? fileManager.contentsOfDirectory(
                      at: descriptorDirectory,
                      includingPropertiesForKeys: [.isDirectoryKey],
                      options: [.skipsHiddenFiles]
                  ) else { continue }
                  for descriptor in contents where
                      ((try? descriptor.resourceValues(forKeys: [.isDirectoryKey]).isDirectory) ?? false) {
                      if !descriptor.lastPathComponent.hasPrefix(".") &&
                          descriptor.lastPathComponent.caseInsensitiveCompare("__MACOSX") != .orderedSame {
                          results.append((ext: "com.apple.PhotosUIPrivate.PhotosPosterProvider", url: descriptor))
                      }
                  }
              }
              if !results.isEmpty { return results }

              // 4. A single descriptor supplied as the payload root.
              if fileManager.fileExists(atPath: payloadRoot.appendingPathComponent("versions").path) ||
                  fileManager.fileExists(atPath: payloadRoot.appendingPathComponent("Wallpaper.plist").path) ||
                  fileManager.fileExists(atPath: payloadRoot.appendingPathComponent("com.apple.posterkit.provider.descriptor.identifier").path) {
                  return [(ext: defaultExt, url: payloadRoot)]
              }

              // 5. Flat collections of descriptor folders.
              if let topLevel = try? fileManager.contentsOfDirectory(
                  at: payloadRoot,
                  includingPropertiesForKeys: [.isDirectoryKey],
                  options: [.skipsHiddenFiles]
              ) {
                  for subfolder in topLevel where
                      ((try? subfolder.resourceValues(forKeys: [.isDirectoryKey]).isDirectory) ?? false) {
                      let hasVersions = fileManager.fileExists(atPath: subfolder.appendingPathComponent("versions").path)
                      let isUUID = UUID(uuidString: subfolder.lastPathComponent) != nil
                      if (hasVersions || isUUID) &&
                          subfolder.lastPathComponent.caseInsensitiveCompare("__MACOSX") != .orderedSame {
                          results.append((ext: defaultExt, url: subfolder))
                      }
                  }
              }

              return results.isEmpty ? [(ext: defaultExt, url: payloadRoot)] : results
          }'''
          source = source[:function_start] + replacement + source[function_end:]
          source = source.replace('Failed to extract .tendies zip archive', 'Failed to extract wallpaper archive')
          engine.write_text(source)

          plist_path = pathlib.Path('AirCardsSource/ios-app/Info.plist')
          with plist_path.open('rb') as handle:
              info = plistlib.load(handle)
          imported = info.setdefault('UTImportedTypeDeclarations', [])
          if not any(item.get('UTTypeIdentifier') == 'com.aircard.batter' for item in imported):
              imported.append({
                  'UTTypeIdentifier': 'com.aircard.batter',
                  'UTTypeDescription': 'Configurable PosterBoard Wallpaper Template',
                  'UTTypeConformsTo': ['public.data', 'public.archive', 'public.zip-archive'],
                  'UTTypeTagSpecification': {'public.filename-extension': ['batter']},
              })
          document_types = info.setdefault('CFBundleDocumentTypes', [])
          if not any('com.aircard.batter' in item.get('LSItemContentTypes', []) for item in document_types):
              document_types.append({
                  'CFBundleTypeName': 'Batter Wallpaper Template',
                  'CFBundleTypeRole': 'Editor',
                  'LSHandlerRank': 'Owner',
                  'LSItemContentTypes': ['com.aircard.batter'],
              })
          with plist_path.open('wb') as handle:
              plistlib.dump(info, handle, sort_keys=False)
          PY

      - name: Remove donation interface
        run: |
          python3 - <<'PY'
          import pathlib, re

          path = pathlib.Path('AirCardsSource/ios-app/ContentView.swift')
          source = path.read_text()

          donation_start = source.index('// MARK: - Crypto Donation Row')
          credits_content = source.index('    @ViewBuilder\n    private var creditsContent')
          credits_shell = '''// MARK: - Credits Sheet

          struct CreditsSheet: View {
              @Environment(\.dismiss) private var dismiss

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          creditsContent
                      }
                      .navigationTitle("Credits")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button("Done") {
                                  dismiss()
                              }
                              .bold()
                          }
                      }
                  }
                  .presentationDetents([.medium, .large])
              }

          '''
          source = source[:donation_start] + credits_shell + source[credits_content:]

          banner_start = source.index('            // Donate banner inside credits')
          banner_end = source.index('            Divider()', banner_start)
          source = source[:banner_start] + source[banner_end:]

          source = source.replace(
              '    @AppStorage("aircard.dont_show_support_on_launch") private var dontShowSupportOnLaunch: Bool = false\n'
              '    @State private var showSupportPopup: Bool = false\n',
              ''
          )
          source = source.replace(
              '        .sheet(isPresented: $showSupportPopup) {\n'
              '            SupportPopupSheet(dontShowOnLaunch: $dontShowSupportOnLaunch)\n'
              '        }\n',
              ''
          )
          source = source.replace(
              '            if !dontShowSupportOnLaunch {\n'
              '                DispatchQueue.main.asyncAfter(deadline: .now() + 0.4) {\n'
              '                    showSupportPopup = true\n'
              '                }\n'
              '            }\n',
              ''
          )
          source = source.replace('Credits & Donate', 'Credits')
          source = source.replace('Image(systemName: "heart.fill")', 'Image(systemName: "info.circle.fill")')

          forbidden = re.findall(r'(?i)donat(?:e|ion)|paypal|crypto donation', source)
          if forbidden:
              raise RuntimeError(f'Donation interface remains in ContentView.swift: {forbidden[:3]}')

          path.write_text(source)
          PY

      - name: Apply Udara black and green interface
        run: |
          python3 - <<'PY'
          import pathlib

          path = pathlib.Path('AirCardsSource/ios-app/AirCardApp.swift')
          source = path.read_text()
          source = source.replace('import SwiftUI\n', 'import SwiftUI\nimport UIKit\n', 1)
          init_anchor = '''    init() {
                  // Route Rust tracing/idevice logs into the app's vm log array.
          '''
          appearance = '''    init() {
                  let navigation = UINavigationBarAppearance()
                  navigation.configureWithOpaqueBackground()
                  navigation.backgroundColor = UIColor(red: 0.015, green: 0.055, blue: 0.035, alpha: 0.97)
                  navigation.titleTextAttributes = [.foregroundColor: UIColor.white]
                  navigation.largeTitleTextAttributes = [.foregroundColor: UIColor.white]
                  UINavigationBar.appearance().standardAppearance = navigation
                  UINavigationBar.appearance().scrollEdgeAppearance = navigation
                  UINavigationBar.appearance().compactAppearance = navigation

                  let tabs = UITabBarAppearance()
                  tabs.configureWithOpaqueBackground()
                  tabs.backgroundColor = UIColor(red: 0.01, green: 0.04, blue: 0.025, alpha: 0.98)
                  tabs.stackedLayoutAppearance.selected.iconColor = UIColor.systemGreen
                  tabs.stackedLayoutAppearance.selected.titleTextAttributes = [.foregroundColor: UIColor.systemGreen]
                  UITabBar.appearance().standardAppearance = tabs
                  UITabBar.appearance().scrollEdgeAppearance = tabs
                  UITableView.appearance().backgroundColor = .clear
                  UICollectionView.appearance().backgroundColor = .clear

                  // Route Rust tracing/idevice logs into the app's vm log array.
          '''
          if init_anchor not in source:
              raise RuntimeError('App appearance insertion point was not found')
          source = source.replace(init_anchor, appearance, 1)

          old_root = '''        WindowGroup {
                      ContentView()
                          .environmentObject(vm)
                  }
          '''
          new_root = '''        WindowGroup {
                      ZStack {
                          LinearGradient(
                              colors: [
                                  Color.black,
                                  Color(red: 0.01, green: 0.18, blue: 0.10),
                                  Color(red: 0.00, green: 0.05, blue: 0.03),
                                  Color.black
                              ],
                              startPoint: .topLeading,
                              endPoint: .bottomTrailing
                          )
                          .ignoresSafeArea()

                          ContentView()
                              .environmentObject(vm)
                      }
                      .tint(Color(red: 0.20, green: 0.95, blue: 0.48))
                      .preferredColorScheme(.dark)
                  }
          '''
          if old_root not in source:
              raise RuntimeError('App root interface was not found')
          path.write_text(source.replace(old_root, new_root, 1))
          PY

      - name: Build unsigned iPhone app
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          cd AirCardsSource
          xcodebuild \
            -project AirCard-iOS.xcodeproj \
            -scheme AirCard-iOS \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            clean build \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package and verify IPA
        run: |
          mkdir -p artifacts/Payload
          APP_PATH="$(find AirCardsSource/build/DerivedData/Build/Products -name 'AirCard-iOS.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          cp -R "$APP_PATH" artifacts/Payload/AirCards.app
          rm -rf artifacts/Payload/AirCards.app/_CodeSignature artifacts/Payload/AirCards.app/embedded.mobileprovision
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' artifacts/Payload/AirCards.app/Info.plist)"
          file "artifacts/Payload/AirCards.app/$EXECUTABLE" | tee artifacts/device-binary.txt
          xcrun lipo "artifacts/Payload/AirCards.app/$EXECUTABLE" -verify_arch arm64
          if codesign -d artifacts/Payload/AirCards.app 2>/dev/null; then
            echo 'The packaged app must be unsigned' >&2
            exit 1
          fi
          (cd artifacts && /usr/bin/zip -q -r AirCards-unsigned.ipa Payload)
          unzip -t artifacts/AirCards-unsigned.ipa
          shasum -a 256 artifacts/AirCards-unsigned.ipa | tee artifacts/SHA256SUMS.txt
          cp AirCardsSource/LICENSE artifacts/UPSTREAM-LICENSE.txt

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: aircards-ipa
          path: artifacts/AirCards-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build report
        uses: actions/upload-artifact@v7
        with:
          name: aircards-build-report
          path: |
            artifacts/device-binary.txt
            artifacts/SHA256SUMS.txt
            artifacts/UPSTREAM-LICENSE.txt
          if-no-files-found: error
          retention-days: 30
